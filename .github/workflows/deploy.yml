name: Deploy

# Manual-only until cutover. GitHub Pages for this repo is still in "legacy"
# mode (deploy from branch main, path /), which is what serves the plain .html
# files at the repo root. While that is the case actions/deploy-pages fails,
# so a push trigger would put a red X on every commit without changing the
# site. At cutover: set Settings -> Pages -> Source to "GitHub Actions", then
# restore the push trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
