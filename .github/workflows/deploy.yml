name: Deploy

# Builds dist/ and publishes it as the Pages artifact on every push to main.
#
# This only reaches the live site once Pages Source is "GitHub Actions"
# (build_type 'workflow'). Until then the branch build keeps serving the legacy
# .html at the repo root and this workflow still succeeds — the earlier note
# here claimed actions/deploy-pages errors under branch-deploy; run 31237197353
# shows it does not, it just publishes a deployment nothing routes to yet.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
